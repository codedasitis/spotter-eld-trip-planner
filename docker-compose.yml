services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Overridable via a .env file in this directory (see .env.example);
      # these are safe local-dev defaults so `docker-compose up` works
      # immediately after a cold clone even with no .env file at all.
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
